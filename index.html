<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>倶知安 住宅計画 — 3Dウォークスルー</title>
<style>
  :root{ --ui:#11161c; --ui2:#1b2430; --fg:#e8eef5; --ac:#5ac8fa; --bd:#2c3a4a; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0f14;color:var(--fg);
    font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #c{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
  #c.look{cursor:grabbing}
  .panel{position:fixed;background:rgba(17,22,28,.86);backdrop-filter:blur(8px);
    border:1px solid var(--bd);border-radius:12px;padding:8px}
  #top{top:8px;left:8px;right:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  #top .t{font-weight:700;margin-right:4px;white-space:nowrap}
  #top .sub{opacity:.55;font-size:11px;white-space:nowrap}
  button{background:var(--ui2);color:var(--fg);border:1px solid var(--bd);border-radius:8px;
    padding:6px 9px;font:inherit;cursor:pointer;white-space:nowrap}
  button:hover{border-color:var(--ac)}
  button.on{background:var(--ac);color:#04121c;border-color:var(--ac);font-weight:700}
  button.ac{border-color:#f5b84a;color:#ffd58a}
  button[hidden],.badge[hidden]{display:none}
  .badge{font-size:11px;padding:3px 7px;border-radius:7px;background:#3a2c10;color:#ffd58a;border:1px solid #6b4f1c;white-space:nowrap}
  select{background:var(--ui2);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;font:inherit}
  #move{left:8px;bottom:8px;display:grid;grid-template-columns:repeat(3,44px);gap:5px}
  #look{right:8px;bottom:8px;display:grid;grid-template-columns:repeat(3,44px);gap:5px}
  .pad button{width:44px;height:40px;padding:0;font-size:15px;display:flex;align-items:center;justify-content:center}
  .pad button.sp{visibility:hidden;pointer-events:none}
  .pad .lbl{grid-column:1/4;text-align:center;font-size:10px;opacity:.5;letter-spacing:.06em}
  #mid{left:50%;transform:translateX(-50%);bottom:8px;display:flex;gap:10px;align-items:center}
  #mid label{font-size:10px;opacity:.6;display:block;letter-spacing:.05em}
  input[type=range]{width:110px;accent-color:var(--ac);vertical-align:middle}
  #hud{position:fixed;left:8px;top:54px;font-size:11px;opacity:.6;pointer-events:none;text-shadow:0 1px 3px #000}
  #help{position:fixed;inset:0;background:rgba(6,9,12,.9);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
  #help.show{display:flex}
  #help .box{max-width:560px;background:var(--ui);border:1px solid var(--bd);border-radius:14px;padding:18px 20px;line-height:1.7;max-height:88vh;overflow:auto}
  #help h3{margin:0 0 8px}
  kbd{background:var(--ui2);border:1px solid var(--bd);border-radius:5px;padding:1px 6px;font:12px monospace}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0f14;z-index:30;flex-direction:column;gap:10px}
  .sp{width:26px;height:26px;border:3px solid #223;border-top-color:var(--ac);border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .seg{display:inline-flex}
  .seg button{border-radius:0;margin-left:-1px}
  .seg button:first-child{border-radius:8px 0 0 8px;margin-left:0}
  .seg button:last-child{border-radius:0 8px 8px 0}
  #roofp{right:8px;top:56px;width:236px;display:flex;flex-direction:column;gap:5px}
  #roofp[hidden]{display:none}
  #roofp .rt{font-size:10px;opacity:.6;letter-spacing:.05em}
  #roofp #roofRead{font-weight:700;font-size:12px;white-space:nowrap}
  #roofp label{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;white-space:nowrap}
  #roofp label b{min-width:38px;text-align:right}
  #roofp input[type=range]{width:118px}
  @media (max-width:560px){ #mid{display:none} #top{gap:4px;padding:6px} #top .sub{display:none}
    #roofp{width:auto;max-width:calc(100vw - 16px);padding:6px 8px;gap:3px}
    #roofp #roofRead{white-space:normal;font-size:11px} #roofp input[type=range]{width:84px} #roofp label{font-size:10px} }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top" class="panel">
  <span class="t" data-i18n="title">倶知安 住宅計画</span>
  <span class="seg" data-i18n-title="hsegt"><button id="bH1" data-i18n="h1" data-i18n-title="h1t">プランA</button><button id="bH2" data-i18n="h2" data-i18n-title="h2t">プランB</button><button id="bH3" data-i18n="h3" data-i18n-title="h3t">土屋 参考プラン</button></span>
  <button id="bEdit" class="ac" data-i18n="edit" data-i18n-title="editt" hidden>間取りを編集</button>
  <span id="srcBadge" class="badge" hidden></span>
  <button id="bOrig" data-i18n="origb" data-i18n-title="origt" hidden>元の図面を表示</button>
  <span class="sub" id="areaInfo"></span>
  <select id="jump" data-i18n-title="jumpt"></select>
  <button id="bWalk" data-i18n-title="walkt">歩行</button>
  <button id="bFloors" data-i18n-title="floorst">全フロア</button>
  <button id="bCeil" data-i18n="roof" data-i18n-title="rooft">屋根</button>
  <button id="bLbl" data-i18n="labels" data-i18n-title="labelst">部屋名</button>
  <button id="bMouse" data-i18n="mouse" data-i18n-title="mouset">マウス視点</button>
  <button id="bQual" data-i18n-title="qualt">画質：高</button>
  <button id="bLang" data-i18n="lang" data-i18n-title="langt">English</button>
  <button id="bHelp">?</button>
</div>

<div id="hud"></div>

<div id="roofp" class="panel" hidden>
  <div class="rt" data-i18n="roofp">屋根・2階天井</div>
  <div id="roofRead"></div>
  <label data-i18n-title="livst"><span data-i18n="livs">リビング側</span> <input id="hLiv" type="range" min="2.4" max="9" step="0.1" value="6"><b id="hLivV">6.0 m</b></label>
  <label data-i18n-title="bedst"><span data-i18n="beds">寝室側</span> <input id="hBed" type="range" min="2.4" max="9" step="0.1" value="3"><b id="hBedV">3.0 m</b></label>
</div>

<div id="move" class="pad panel">
  <span class="lbl" data-i18n="move">移動</span>
  <button data-h="up">↑</button><button data-h="fwd">▲</button><button data-h="dn">↓</button>
  <button data-h="left">◀</button><button data-h="back">▼</button><button data-h="right">▶</button>
  <span class="lbl" data-i18n="moveh">▲▼ 前後・◀▶ 左右・↑↓ 上下</span>
</div>

<div id="mid" class="panel">
  <div data-i18n-title="fovt"><label><span data-i18n="fov">画角</span> <span id="fovv">100°</span></label><input id="fov" type="range" min="40" max="100" value="100"></div>
  <div><label data-i18n="speed">速度</label><input id="spd" type="range" min="1" max="10" value="4"></div>
  <button id="bWide" data-i18n="wide" data-i18n-title="widet">広角</button>
  <button id="bNarrow" data-i18n="narrow" data-i18n-title="narrowt">望遠</button>
</div>

<div id="look" class="pad panel">
  <span class="lbl" data-i18n="look">視点</span>
  <button class="sp"></button><button data-h="lookup">↑</button><button class="sp"></button>
  <button data-h="lookl">◀</button><button data-h="lvl" data-i18n-title="lvlt">⌖</button><button data-h="lookr">▶</button>
  <button class="sp"></button><button data-h="lookdn">↓</button><button class="sp"></button>
  <button data-h="wide" data-i18n-title="wt">W</button><button data-h="orbit" data-i18n-title="ot">◎</button><button data-h="narrow" data-i18n-title="nt">N</button>
</div>

<div id="help"><div class="box">
<div id="helpBody"></div>
<span id="helpGeo" style="opacity:.6"></span>
<div style="margin-top:14px"><button data-i18n="close" onclick="document.getElementById('help').classList.remove('show')">閉じる</button></div>
</div></div>

<div id="load"><div class="sp"></div><div id="loadmsg" style="opacity:.6">建物を作成中…</div></div>

<script type="importmap">
{"imports":{"three":"./three.module.min.js","three/addons/":"./jsm/"}}
</script>
<script type="module" src="app.js?v=9"></script>
</body>
</html>
